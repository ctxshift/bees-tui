[tools]
node = "25.6.1"

[env]
# Local Bees source checkout; an installed bees on PATH remains a fallback.
_.path = ["../zig/bees/zig-out/bin"]

[tasks.setup]
description = "Install locked dependencies"
run = "npm ci"

[tasks.build]
run = "npm run build"

[tasks."build:binary"]
description = "Compile a standalone TUI executable using Bun"
run = "npm run build:binary"

[tasks."test:binary"]
description = "Build and test the standalone executable in a real terminal"
depends = ["build:binary"]
env = { BEES_TUI_TEST_BINARY = "1" }
run = "npx vitest run test/pty.test.ts"

[tasks.start]
description = "Open the live TUI in the current Bees project"
raw = true
run = "npm start"

[tasks.test]
run = "npm run check"

[tasks.bees]
description = "Use this project's Bees tracker"
run = "bees"
